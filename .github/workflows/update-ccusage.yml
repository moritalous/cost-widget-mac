name: Update ccusage

# Opens (or reuses) a "ccusage/<version>" pull request, builds it, and when the
# build succeeds merges it and dispatches the Release workflow.
#
# All of this runs inside a single workflow run: workflow runs started with
# GITHUB_TOKEN do not trigger workflow_run events, so chaining a separate
# "build finished" workflow never fires.

on:
  schedule:
    # 18:17 UTC = 03:17 JST
    - cron: "17 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-ccusage
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      branch: ${{ steps.pr.outputs.branch }}
      sha: ${{ steps.pr.outputs.sha }}
      number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Open or reuse a pull request for a newer ccusage
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          current="$(tr -d '[:space:]' < .ccusage-version)"
          latest="$(npm view @ccusage/ccusage-darwin-arm64 version)"
          echo "Bundled ccusage: ${current}, latest: ${latest}"
          if [ "${current}" = "${latest}" ]; then
            echo "Already up to date"
            exit 0
          fi

          branch="ccusage/${latest}"
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null; then
            pr="$(gh pr list --head "${branch}" --base "${DEFAULT_BRANCH}" --state open --json number,headRefOid,author \
              --jq '[.[] | select(.author.login == "app/github-actions" or .author.login == "github-actions[bot]")][0]')"
            if [ -z "${pr}" ] || [ "${pr}" = "null" ]; then
              echo "Branch ${branch} exists without an open github-actions pull request; skipping"
              exit 0
            fi
            number="$(jq -r .number <<<"${pr}")"
            sha="$(jq -r .headRefOid <<<"${pr}")"
            echo "Reusing pull request #${number} (${sha})"
          else
            echo "${latest}" > .ccusage-version
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "${branch}"
            git commit -am "Update bundled ccusage to ${latest}"
            git push origin "${branch}"
            sha="$(git rev-parse HEAD)"

            url="$(gh pr create \
              --base "${DEFAULT_BRANCH}" \
              --head "${branch}" \
              --title "Update bundled ccusage to ${latest}" \
              --body "Updates the bundled ccusage from ${current} to ${latest}.

          Release notes: https://github.com/ccusage/ccusage/releases/tag/v${latest}")"
            number="${url##*/}"
          fi

          {
            echo "branch=${branch}"
            echo "sha=${sha}"
            echo "number=${number}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.sha != ''
    permissions:
      contents: read
    uses: ./.github/workflows/macos.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  merge-and-release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NUMBER: ${{ needs.prepare.outputs.number }}
      TESTED_SHA: ${{ needs.prepare.outputs.sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Merge the verified update pull request
        # Only merge exactly the commit that the build verified.
        run: gh pr merge "${NUMBER}" --squash --delete-branch --match-head-commit "${TESTED_SHA}"

      - name: Close superseded ccusage pull requests
        run: |
          gh pr list --state open --base "${DEFAULT_BRANCH}" --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("ccusage/")) | .number' |
          while read -r number; do
            gh pr close "${number}" --delete-branch \
              --comment "Superseded by a newer bundled ccusage update that was merged and released automatically."
          done

      - name: Dispatch the Release workflow
        run: |
          latest_tag="$(gh release view --json tagName --jq .tagName)"
          latest="${latest_tag#v}"
          IFS=. read -r major minor patch <<<"${latest}"
          next="${major}.${minor}.$((patch + 1))"
          echo "Releasing ${next} (previous: ${latest})"
          gh workflow run release.yml --ref "${DEFAULT_BRANCH}" -f version="${next}"
